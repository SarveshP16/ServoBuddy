name: servobuddy
description: "ServoBuddy - personal vehicle manager."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  lucide_icons_flutter: ^3.1.20
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  file_picker: ^13.2.0
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # Bundled so text renders the same offline and in widget tests.
  fonts:
    # Variable (weight 100-900, width 62-125). SIL Open Font License:
    # assets/fonts/Archivo-OFL.txt.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
